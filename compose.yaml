services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: linguastream
      POSTGRES_PASSWORD: linguastream
      POSTGRES_DB: linguastream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguastream -d linguastream"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
