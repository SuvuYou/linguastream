services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: linguastream_user
      POSTGRES_PASSWORD: linguastream_pass
      POSTGRES_DB: linguastream_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguastream_user -d linguastream_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nlp:
    build: ./services/nlp
    ports:
      - "8100:8000"

volumes:
  pgdata:
  redisdata:
