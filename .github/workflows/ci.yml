name: CI

on:
  pull_request:
    branches: [master, development]

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linguastream_user
          POSTGRES_PASSWORD: linguastream_pass
          POSTGRES_DB: linguastream_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linguastream_user -d linguastream_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://test
      FIREBASE_ADMIN_PROJECT_ID: test
      FIREBASE_ADMIN_CLIENT_EMAIL: test
      FIREBASE_ADMIN_PRIVATE_KEY: test
      TEST_DATABASE_URL: postgresql://linguastream_user:linguastream_pass@localhost:5432/linguastream_db_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall in apps/web runs `prisma generate`
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm turbo run lint typecheck

      - name: Test (web with coverage thresholds)
        run: pnpm turbo run test:coverage --filter=@linguastream/web

      - name: Test (other workspaces)
        run: pnpm turbo run test --filter=!@linguastream/web

      - name: Integration tests (real Postgres)
        run: pnpm test:integration
