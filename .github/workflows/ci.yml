name: CI

on:
  pull_request:
    branches: [master, development]

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://test
      FIREBASE_ADMIN_PROJECT_ID: test
      FIREBASE_ADMIN_CLIENT_EMAIL: test
      FIREBASE_ADMIN_PRIVATE_KEY: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall in apps/web runs `prisma generate`
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm turbo run lint typecheck

      - name: Test (web with coverage thresholds)
        run: pnpm turbo run test:coverage --filter=@linguastream/web

      - name: Test (other workspaces)
        run: pnpm turbo run test --filter=!@linguastream/web
